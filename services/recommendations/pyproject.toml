[project]
name = "eventflow-recommendations"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.3", "uvicorn==0.54.0", "httpx==0.28.1",
  "psycopg[binary,pool]==3.3.8", "pgvector==0.5.1", "aio-pika==10.2.3",
  "PyJWT[crypto]==2.15.1", "sentence-transformers==5.2.0",
  "transformers==4.57.6", "torch==2.10.0+cpu",
  "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4", "psutil==7.2.2", "mypy==2.4.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires the isolated local vector database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
