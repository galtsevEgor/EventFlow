name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tools:setup
      - run: pnpm check:workflow
      - run: pnpm cluster check
      - run: pnpm check:secrets
      - run: pnpm audit:runtime
      - run: pnpm check
      - run: pnpm build
      - run: pnpm storybook:build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:init
      - run: pnpm infra:check
      - run: pnpm infra:up
      - run: pnpm observability check
      - run: pnpm observability up
      - run: pnpm identity:seed
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm test:catalog
      - run: pnpm test:publication
      - run: pnpm test:booking
      - run: pnpm test:payments
      - run: pnpm test:tickets
      - run: pnpm test:operators
      - run: pnpm test:realtime
      - run: pnpm test:realtime-load --smoke
      - run: pnpm test:telemetry
      - run: pnpm test:telemetry-load --smoke
      - run: pnpm tools:setup
      - run: pnpm test:load --smoke
      - run: pnpm test:overload --smoke
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:identity
      - run: pnpm test:e2e
      - run: pnpm test:infra
      - run: pnpm test:spikes
      - name: Dependency status on failure
        if: failure()
        run: pnpm infra:status
      - name: Stop dependencies
        if: always()
        run: pnpm infra:down
      - name: Stop observability
        if: always()
        run: pnpm observability down

  ci-gate:
    if: always()
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
