apiVersion: 1
datasources:
  - name: EventFlow metrics
    uid: eventflow-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: EventFlow traces
    uid: eventflow-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
