groups:
  - name: eventflow
    rules:
      - alert: EventFlowCollectorDown
        expr: up{job="eventflow"} == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: 'Collector metrics endpoint is unavailable' }
      - alert: EventFlowDependencyDown
        expr: min by (service_name, deployment_environment_name, component) (eventflow_dependency_up{deployment_environment_name!="test"}) == 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'A service dependency is unavailable' }
      - alert: EventFlowHttpErrors
        expr: (sum by (service_name, deployment_environment_name) (rate(eventflow_http_requests_total{status=~"5..",deployment_environment_name!="test"}[5m])) / sum by (service_name, deployment_environment_name) (rate(eventflow_http_requests_total{deployment_environment_name!="test"}[5m])) > 0.05) and (sum by (service_name, deployment_environment_name) (rate(eventflow_http_requests_total{deployment_environment_name!="test"}[5m])) > 0.1)
        for: 2m
        labels: { severity: warning }
        annotations: { summary: 'HTTP server errors exceed five percent with sufficient traffic' }
      - alert: EventFlowOutboxStalled
        expr: max by (service_name, deployment_environment_name) (eventflow_outbox_oldest_seconds{deployment_environment_name!="test"}) > 60
        for: 2m
        labels: { severity: warning }
        annotations: { summary: 'An unpublished outbox message is older than one minute' }
      - alert: EventFlowFinancialWorkStalled
        expr: max by (service_name, deployment_environment_name) ({__name__=~"eventflow_(payment|refund)_oldest_seconds",deployment_environment_name!="test"}) > 300
        for: 2m
        labels: { severity: warning }
        annotations: { summary: 'Payment or refund processing is overdue by five minutes' }
      - alert: EventFlowFinancialReview
        expr: max by (service_name, deployment_environment_name) ({__name__=~"eventflow_(payment|refund)_review",deployment_environment_name!="test"}) > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'Payment or refund requires operator review' }
      - alert: EventFlowMailDead
        expr: max by (service_name, deployment_environment_name) (eventflow_mail_dead{deployment_environment_name!="test"}) > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'A mail job exhausted its delivery attempts' }
      - alert: EventFlowMessageDead
        expr: sum by (service_name, deployment_environment_name) (increase(eventflow_messages_total{operation="dead",outcome="ok",deployment_environment_name!="test"}[5m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'A message was routed to a dead letter queue' }
      - alert: EventFlowServiceMissing
        expr: eventflow:service_expected unless on (service_name, deployment_environment_name) (max by (service_name, deployment_environment_name) (eventflow_service_up) == 1)
        for: 2m
        labels: { severity: critical }
        annotations: { summary: 'An expected deployment service stopped reporting metrics' }
