receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 64
    send_batch_max_size: 128
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    metric_expiration: 30s
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    sending_queue:
      queue_size: 256
      num_consumers: 1
    retry_on_failure:
      initial_interval: 1s
      max_interval: 3s
      max_elapsed_time: 10s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
