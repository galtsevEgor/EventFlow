global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: ['/etc/prometheus/alerts.yaml', '/etc/prometheus/deployments.yaml']
scrape_configs:
  - job_name: eventflow
    static_configs:
      - targets: ['collector:8889']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
