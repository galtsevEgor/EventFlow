name: eventflow-observability
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ['--config=/etc/collector.yaml']
    volumes: ['./infra/observability/collector.yaml:/etc/collector.yaml:ro']
    ports: ['127.0.0.1:14318:4318', '127.0.0.1:13133:13133']
    mem_limit: 256m
    cpus: 0.5
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ['-config.file=/etc/tempo.yaml']
    volumes: ['./infra/observability/tempo.yaml:/etc/tempo.yaml:ro', 'tempo-data:/var/tempo']
    ports: ['127.0.0.1:13200:3200']
    mem_limit: 512m
    cpus: 0.5
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yaml',
        '--storage.tsdb.retention.time=24h',
        '--storage.tsdb.retention.size=512MB',
      ]
    volumes:
      [
        './infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro',
        'prometheus-data:/prometheus',
      ]
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:19090:9090']
    mem_limit: 256m
    cpus: 0.5
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Use pnpm observability up}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
    volumes:
      [
        './infra/observability/datasources.yaml:/etc/grafana/provisioning/datasources/eventflow.yaml:ro',
        'grafana-data:/var/lib/grafana',
      ]
    ports: ['127.0.0.1:13000:3000']
    mem_limit: 384m
    cpus: 0.5
volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
