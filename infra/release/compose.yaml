x-databases: &databases
  WAITLIST_DATABASE_URL: postgresql://waitlist:${WAITLIST_DB_PASSWORD}@postgres:5432/waitlist
  ANALYTICS_DATABASE_URL: postgresql://analytics:${ANALYTICS_DB_PASSWORD}@postgres:5432/analytics
  CATALOG_DATABASE_URL: postgresql://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog
  BOOKING_DATABASE_URL: postgresql://booking:${BOOKING_DB_PASSWORD}@postgres:5432/booking
  PAYMENTS_DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD}@postgres:5432/payments
  TICKETS_DATABASE_URL: postgresql://tickets:${TICKETS_DB_PASSWORD}@postgres:5432/tickets

services:
  temporal:
    ports: !reset []
  clickhouse:
    ports: !reset []
  opensearch:
    ports: !reset []
  postgres:
    ports: !reset []
    mem_limit: 640m
  redis:
    ports: !reset []
    mem_limit: 192m
  rabbitmq:
    ports: !reset []
    mem_limit: 512m
  keycloak:
    ports: !reset []
    environment:
      KC_HOSTNAME: http://127.0.0.1:${RELEASE_IDENTITY_PORT}
    mem_limit: 768m
  s3:
    ports: !reset []
    volumes:
      - type: volume
        source: s3-data
        target: /data
        volume:
          nocopy: true
      - ${RELEASE_DATA_DIR}/local/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 384m
  mailpit:
    ports: !override
      - 127.0.0.1:${RELEASE_MAIL_PORT}:8025
    mem_limit: 128m
  app:
    image: ${RELEASE_IMAGE:-eventflow-release:unselected}
    pull_policy: never
    init: true
    mem_limit: 1700m
    cpus: 3.0
    ports:
      - 127.0.0.1:${RELEASE_PORT}:${RELEASE_PORT}
      - 127.0.0.1:${RELEASE_IDENTITY_PORT}:${RELEASE_IDENTITY_PORT}
    volumes:
      - ${RELEASE_DATA_DIR}/local:/app/work/local
    environment:
      <<: *databases
      EVENTFLOW_TELEMETRY_ENABLED: ${EVENTFLOW_TELEMETRY_ENABLED:-false}
      EVENTFLOW_ENVIRONMENT: ${EVENTFLOW_ENVIRONMENT:-local}
      EVENTFLOW_TRACE_SAMPLE_RATIO: ${EVENTFLOW_TRACE_SAMPLE_RATIO:-0.1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://collector:4318/v1/metrics}
      EVENTFLOW_HTTP_CONCURRENCY: ${EVENTFLOW_HTTP_CONCURRENCY:-64}
      EVENTFLOW_API_REQUESTS: ${EVENTFLOW_API_REQUESTS:-600}
      EVENTFLOW_SSR_REQUESTS: ${EVENTFLOW_SSR_REQUESTS:-120}
      EVENTFLOW_API_CONCURRENCY: ${EVENTFLOW_API_CONCURRENCY:-32}
      EVENTFLOW_SSR_CONCURRENCY: ${EVENTFLOW_SSR_CONCURRENCY:-16}
      EVENTFLOW_STREAM_REQUESTS: ${EVENTFLOW_STREAM_REQUESTS:-120}
      EVENTFLOW_STREAM_CONCURRENCY: ${EVENTFLOW_STREAM_CONCURRENCY:-256}
      PUBLIC_ORIGIN: http://127.0.0.1:${RELEASE_PORT}
      KEYCLOAK_URL: http://127.0.0.1:${RELEASE_IDENTITY_PORT}
      OIDC_ISSUER: http://127.0.0.1:${RELEASE_IDENTITY_PORT}/realms/eventflow
      OIDC_CLIENT_ID: eventflow-bff
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      POLICY_CLIENT_SECRET: ${POLICY_CLIENT_SECRET}
      PAYMENTS_CLIENT_SECRET: ${PAYMENTS_CLIENT_SECRET}
      PAYMENTS_OPERATOR_SECRET: ${PAYMENTS_OPERATOR_SECRET}
      TICKET_DELIVERY_CLIENT_SECRET: ${TICKET_DELIVERY_CLIENT_SECRET}
      MAIL_OPERATOR_SECRET: ${MAIL_OPERATOR_SECRET}
      TICKET_QR_KEYS: ${TICKET_QR_KEYS}
      BOOKING_CONTACT_KEY: ${BOOKING_CONTACT_KEY}
      CATALOG_INVITATION_KEY: ${CATALOG_INVITATION_KEY}
      CATALOG_URL: http://127.0.0.1:4001
      BOOKING_URL: http://127.0.0.1:4002
      PAYMENTS_URL: http://127.0.0.1:4003
      TICKETS_URL: http://127.0.0.1:4004
      SEARCH_URL: http://127.0.0.1:4005
      ANALYTICS_URL: http://127.0.0.1:4006
      WAITLIST_URL: http://127.0.0.1:4007
      WAITLIST_ENABLED: 'true'
      OFFLINE_CHECK_IN_KEY: ${OFFLINE_CHECK_IN_KEY}
      WAITLIST_CLIENT_SECRET: ${WAITLIST_CLIENT_SECRET}
      WAITLIST_CONTACT_KEY: ${WAITLIST_CONTACT_KEY}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: eventflow
      ANALYTICS_ENABLED: 'true'
      ANALYTICS_CLIENT_SECRET: ${ANALYTICS_CLIENT_SECRET}
      ANALYTICS_SESSION_KEY: ${ANALYTICS_SESSION_KEY}
      ANALYTICS_DATABASE: eventflow_analytics
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SEARCH_ENABLED: 'true'
      SEARCH_CLIENT_SECRET: ${SEARCH_CLIENT_SECRET}
      SEARCH_INDEX_NAMESPACE: ${SEARCH_INDEX_NAMESPACE:-eventflow-search}
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AMQP_URL: amqp://eventflow:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: '1025'
      MAIL_DELIVERY_DISABLED: ${RELEASE_MAIL_DISABLED:-false}
      PAYMENT_PROVIDER: fake
    healthcheck:
      test: ['CMD', 'node', 'scripts/release/smoke.mjs']
      interval: 10s
      timeout: 8s
      start_period: 45s
      retries: 6
  migrate:
    image: ${RELEASE_IMAGE:-eventflow-release:unselected}
    pull_policy: never
    profiles: [maintenance]
    command: ['node', 'scripts/migrate.mjs']
    environment:
      <<: *databases
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
  monitor:
    image: ${RELEASE_IMAGE:-eventflow-release:unselected}
    pull_policy: never
    profiles: [observability]
    command: ['node', 'scripts/release/monitor.mjs']
    mem_limit: 128m
    ports: ['127.0.0.1:${RELEASE_MONITOR_PORT}:9090']
    environment:
      <<: *databases
      AMQP_URL: amqp://eventflow:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RELEASE_PORT: ${RELEASE_PORT}
